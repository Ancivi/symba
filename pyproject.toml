[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "symba"
version = "1.0.0"
description = "SYMBA (SYMbolic BAyesian): inference of higher-order functional networks from multivariate event time series."
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
]

[project.optional-dependencies]
stock = ["yfinance"]  # stock-market case study

[tool.setuptools.packages.find]
where = ["src"]
